name: Živá data Povodí Vltavy

on:
  schedule:
    - cron: '17 * * * *'   # každou hodinu (UTC); GitHub může spuštění o pár minut zpozdit
  workflow_dispatch: {}    # ruční spuštění z karty Actions

permissions:
  contents: write

concurrency:
  group: pvl-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pvl.cz neposílá úplný řetězec certifikátů (chybí mezilehlý CA). Prohlížeče si ho dotáhnou přes AIA,
      # Node ne. Dohledáme chybějící CA stejně (AIA „CA Issuers“) a přidáme je Node; ověření proti systémovým
      # kořenovým CA zůstává zapnuté – nic se nevypíná.
      - name: Doplnit chybějící mezilehlé certifikáty pvl.cz (AIA)
        run: |
          set -e
          openssl s_client -connect www.pvl.cz:443 -servername www.pvl.cz -showcerts </dev/null 2>/dev/null \
            | awk '/BEGIN CERT/{n++} n{print > ("srv" n ".pem")} /END CERT/{n=n}' || true
          openssl x509 -in srv1.pem -noout -subject -issuer
          last=srv1.pem; : > extra-ca.pem   # řetězec stavíme od listového certifikátu (server posílá nesprávný mezilehlý)
          for i in 1 2 3 4; do
            url=$(openssl x509 -in "$last" -noout -ext authorityInfoAccess 2>/dev/null | sed -n 's/.*CA Issuers - URI:\(.*\)/\1/p' | head -1)
            [ -z "$url" ] && break
            echo "AIA: $url"
            curl -sSfL --max-time 20 "$url" -o ca.bin
            openssl x509 -inform DER -in ca.bin -out ca$i.pem 2>/dev/null || openssl x509 -in ca.bin -out ca$i.pem
            openssl x509 -in ca$i.pem -noout -subject -issuer
            cat ca$i.pem >> extra-ca.pem; last=ca$i.pem
            # skončit, jakmile je vydavatel v systémovém úložišti
            openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt ca$i.pem >/dev/null 2>&1 && break
          done
          echo "NODE_EXTRA_CA_CERTS=$PWD/extra-ca.pem" >> "$GITHUB_ENV"
          rm -f srv*.pem ca.bin

      - name: Stáhnout data z pvl.cz
        run: node fetch_pvl.mjs live/pvl.new.json

      - name: Diagnostika spojení (jen při chybě)
        if: failure()
        run: curl -sS -v -o /dev/null --max-time 30 https://www.pvl.cz/portal/nadrze/cz/pc/Prehled.aspx 2>&1 | grep -Ei "connected|ssl|tls|certificate|issuer|subject|HTTP/|error|timed" || true

      - name: Uložit, pokud přibylo nové měření
        run: |
          new=$(node -e "console.log(require('./live/pvl.new.json').tMs)")
          old=$(node -e "try{console.log(require('./live/pvl.json').tMs)}catch(e){console.log(0)}")
          if [ "$new" = "$old" ]; then
            echo "Beze změny (tMs $new)"; rm live/pvl.new.json; exit 0
          fi
          mv live/pvl.new.json live/pvl.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/pvl.json
          git commit -m "Data PVL $(node -e "console.log(require('./live/pvl.json').measured)")"
          git push
