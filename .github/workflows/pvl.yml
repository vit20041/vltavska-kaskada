name: Živá data Povodí Vltavy

on:
  schedule:
    - cron: '17 * * * *'   # každou hodinu (UTC); GitHub může spuštění o pár minut zpozdit
  workflow_dispatch: {}    # ruční spuštění z karty Actions

permissions:
  contents: write

concurrency:
  group: pvl-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stáhnout data z pvl.cz
        run: node fetch_pvl.mjs live/pvl.new.json

      - name: Uložit, pokud přibylo nové měření
        run: |
          new=$(node -e "console.log(require('./live/pvl.new.json').tMs)")
          old=$(node -e "try{console.log(require('./live/pvl.json').tMs)}catch(e){console.log(0)}")
          if [ "$new" = "$old" ]; then
            echo "Beze změny (tMs $new)"; rm live/pvl.new.json; exit 0
          fi
          mv live/pvl.new.json live/pvl.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/pvl.json
          git commit -m "Data PVL $(node -e "console.log(require('./live/pvl.json').measured)")"
          git push
