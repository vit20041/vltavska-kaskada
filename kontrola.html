<!doctype html>
<html lang="cs" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kontrola testování</title>
<style>
:root{--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--font:"Segoe UI",system-ui,sans-serif;--r:12px}
[data-theme=dark]{color-scheme:dark;--bg:#0b1016;--s:#131a23;--s2:#19212c;--s3:#222c39;--b:#253040;--b2:#364456;--t:#e8eef6;--t2:#a7b4c4;--m:#75839a;--a:#4d9bf0;--on:#06121f;--good:#35c26b;--warn:#eeb02f;--crit:#f06464}
[data-theme=light]{color-scheme:light;--bg:#edf1f6;--s:#fff;--s2:#f4f6fa;--s3:#e8edf3;--b:#e0e5ec;--b2:#cbd3de;--t:#0d1622;--t2:#465365;--m:#6d798b;--a:#2a78d6;--on:#fff;--good:#0f9d36;--warn:#b97b00;--crit:#d03b3b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 var(--font)}button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.muted{color:var(--m)}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--b)}header b{font-size:16px}.sp{flex:1}
.btn{border:1px solid var(--b2);background:var(--s2);border-radius:8px;padding:5px 11px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap}.btn:hover{border-color:var(--a)}.btn.acc{background:var(--a);border-color:var(--a);color:var(--on)}.btn.danger{color:var(--crit)}.btn.sm{padding:2px 8px;font-size:12px}
input,select{background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:5px 9px}
main{padding:14px 16px 40px;display:grid;gap:12px;max-width:1680px;margin:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.tile{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:9px 13px}.tile small{color:var(--m);display:block}.tile b{font:650 21px var(--mono)}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:13px;min-width:0}.card h2{font-size:14.5px;margin:0}.chead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:12px;align-items:start}@media(max-width:1050px){.two{grid-template-columns:1fr}}
.scroll{overflow:auto;max-height:430px}table{border-collapse:collapse;width:100%;font-size:13px}th{position:sticky;top:0;background:var(--s);text-align:left;color:var(--m);font-weight:600;font-size:12px;z-index:1}th,td{padding:5px 7px;border-bottom:1px solid var(--b);white-space:nowrap}td.wrap{white-space:normal;min-width:120px}tr.click{cursor:pointer}tr.click:hover td{background:var(--s2)}tr.on td{background:color-mix(in srgb,var(--a) 16%,transparent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--m);margin-right:5px}.dot.live{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border:1px solid var(--b);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--m)}.chip.y{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--b))}
.tl{max-height:520px;overflow:auto;font-size:13px}.ev{display:grid;grid-template-columns:66px 74px 92px 1fr;gap:8px;padding:3px 4px;border-bottom:1px solid var(--b)}.ev .k{font-weight:600}.ev.error{background:color-mix(in srgb,var(--crit) 13%,transparent)}.ev.crit .k,.ev.error .k{color:var(--crit)}.ev.warn .k{color:var(--warn)}.ev .x{overflow-wrap:anywhere;color:var(--t2)}
canvas{width:100%;height:120px;display:block}
.login{max-width:360px;margin:9vh auto;display:grid;gap:10px}.login label{display:grid;gap:3px;font-size:13px;font-weight:600}.err{color:var(--crit);font-size:13px;min-height:18px}.note{font-size:12.5px;color:var(--t2);margin:6px 0 0}.empty{padding:22px;text-align:center;color:var(--m)}
code{font-family:var(--mono);background:var(--s3);padding:1px 5px;border-radius:5px}
</style></head><body>
<header><b>Kontrola testování</b><span class="muted" id="st"></span><span class="sp"></span><button class="btn" id="theme" aria-label="Přepnout motiv">◐</button><button class="btn" id="refresh" hidden>Obnovit</button><button class="btn" id="out" hidden>Odhlásit</button></header>
<main id="app"></main>
<script src="telemetry.js"></script>
<script>
(()=>{'use strict';
const C=window.VK_TELEMETRY||{}, base=(C.url||'').replace(/\/$/,''), $=s=>document.querySelector(s), app=$('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=x=>x?new Date(x).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}):'—', tm=x=>new Date(x).toLocaleTimeString('cs-CZ');
const dur=ms=>{ const m=Math.round(ms/60000); return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min'; };
try{ const t=localStorage.getItem('vk-theme'); if (t) document.documentElement.dataset.theme=t; }catch(e){}
$('#theme').onclick=()=>{ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; try{ localStorage.setItem('vk-theme',r.dataset.theme); }catch(e){} if (S.events) drawTrend(); };
let auth=null; try{ auth=JSON.parse(sessionStorage.getItem('vk-admin')||'null'); }catch(e){}
const saveAuth=a=>{ auth=a; try{ a?sessionStorage.setItem('vk-admin',JSON.stringify(a)):sessionStorage.removeItem('vk-admin'); }catch(e){} };
const S={testers:[],sessions:[],code:'',sid:null,events:null,filter:'act'};
async function authCall(q,body){ const r=await fetch(`${base}/auth/v1/token?grant_type=${q}`,{method:'POST',headers:{apikey:C.key,'Content-Type':'application/json'},body:JSON.stringify(body)}); const j=await r.json().catch(()=>({})); if (!r.ok) throw new Error(j.error_description||j.msg||'Přihlášení se nepovedlo'); return {token:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000}; }
async function api(path,opt={},retry=true){ if (auth&&auth.exp-Date.now()<60000){ try{ saveAuth(await authCall('refresh_token',{refresh_token:auth.refresh})); }catch(e){ saveAuth(null); viewLogin('Přihlášení vypršelo.'); throw e; } }
  const r=await fetch(`${base}/rest/v1/${path}`,{...opt,headers:{apikey:C.key,Authorization:'Bearer '+auth.token,'Content-Type':'application/json',...(opt.headers||{})}});
  if (r.status===401&&retry&&auth){ try{ saveAuth(await authCall('refresh_token',{refresh_token:auth.refresh})); return api(path,opt,false); }catch(e){ saveAuth(null); viewLogin('Přihlášení vypršelo.'); throw e; } }
  if (!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.message||('Chyba '+r.status)); } return r.status===204?null:r.json().catch(()=>null); }
function viewSetup(){ app.innerHTML=`<div class="card" style="max-width:680px;margin:6vh auto"><h2>Kontrolní okno zatím není připojené</h2><p class="note">V souboru <code>telemetry.js</code> chybí adresa projektu Supabase a veřejný klíč. Postup je v <code>tools/supabase-kontrola.sql</code>.</p></div>`; }
function viewLogin(msg){ $('#refresh').hidden=$('#out').hidden=true; clearInterval(timer); $('#st').textContent=''; app.innerHTML=`<form class="card login" id="lf"><h2>Přihlášení správce</h2><label>E-mail<input id="le" type="email" autocomplete="username" required></label><label>Heslo<input id="lp" type="password" autocomplete="current-password" required></label><div class="err" id="lx">${esc(msg||'')}</div><button class="btn acc">Přihlásit</button></form>`;
  $('#lf').onsubmit=async e=>{ e.preventDefault(); $('#lx').textContent=''; try{ saveAuth(await authCall('password',{email:$('#le').value,password:$('#lp').value})); await start(); }catch(x){ $('#lx').textContent=x.message; } }; }
let timer=0;
async function start(){ const adm=await api('rpc/vk_is_admin',{method:'POST',body:'{}'}); if (adm!==true){ saveAuth(null); return viewLogin('Tento účet nemá oprávnění správce.'); } $('#refresh').hidden=$('#out').hidden=false; viewMain(); await load(); clearInterval(timer); timer=setInterval(()=>{ if (!document.hidden) load(true).catch(()=>{}); },15000); }
$('#refresh').onclick=()=>load(); $('#out').onclick=()=>{ saveAuth(null); viewLogin(); };
function viewMain(){ app.innerHTML=`<div class="tiles" id="tiles"></div><div class="two"><div style="display:grid;gap:12px"><section class="card"><div class="chead"><h2>Testeři</h2><span class="sp" style="flex:1"></span><input id="nN" maxlength="120" placeholder="poznámka (nepovinná)" aria-label="Poznámka" style="width:170px"><button class="btn acc" id="nA">+ Nový tester</button></div><div class="scroll" style="max-height:290px" id="tT"></div><p class="note">Jméno k&nbsp;kódu si veď raději mimo tuto databázi. Do poznámky stačí např. „skupina A“.</p></section><section class="card"><div class="chead"><h2>Relace</h2><span class="sp" style="flex:1"></span><select id="fC" aria-label="Filtr testera"></select></div><div class="scroll" id="sT"></div></section></div><section class="card" id="det"><div class="empty">Vyber relaci vlevo a uvidíš, co tester dělal.</div></section></div>`;
  $('#nA').onclick=addTester; $('#fC').onchange=e=>{ S.code=e.target.value; renderSessions(); }; }
async function load(quiet){ const [t,s]=await Promise.all([api('vk_testers?select=*&order=created_at.asc'),api('vk_sessions?select=*&order=last_at.desc&limit=500')]); S.testers=t||[]; S.sessions=s||[]; renderAll(); $('#st').textContent='aktualizováno '+tm(Date.now()); if (S.sid&&S.sessions.some(x=>x.id===S.sid)) await loadEvents(S.sid,quiet); else if (S.sid){ S.sid=null; S.events=null; $('#det').innerHTML='<div class="empty">Relace už neexistuje.</div>'; } }
const live=s=>Date.now()-new Date(s.last_at)<60000, span=s=>Math.max(0,new Date(s.last_at)-new Date(s.started_at));
function renderAll(){ const L=S.sessions, tot=L.reduce((a,s)=>a+span(s),0), act=new Set(L.map(s=>s.code)).size;
  $('#tiles').innerHTML=[['Právě online',L.filter(live).length],['Testeři s aktivitou',`${act} / ${S.testers.length}`],['Relace',L.length],['Celkem času',dur(tot)],['Záznamů',L.reduce((a,s)=>a+s.events_n,0).toLocaleString('cs-CZ')],['Chyby aplikace',L.reduce((a,s)=>a+s.errors_n,0)]].map(([l,v])=>`<div class="tile"><small>${l}</small><b>${esc(v)}</b></div>`).join('');
  $('#tT').innerHTML=S.testers.length?`<table><tr><th>Kód</th><th>Poznámka</th><th>Relací</th><th>Naposledy</th><th></th></tr>${S.testers.map(t=>{ const x=L.filter(s=>s.code===t.code), on=x.some(live); return `<tr><td class="mono"><span class="dot ${on?'live':''}"></span>${esc(t.code)}</td><td class="wrap">${esc(t.note)}</td><td class="mono">${x.length}</td><td>${x[0]?dt(x[0].last_at):'—'}</td><td><button class="btn sm" data-copy="${esc(t.code)}">Odkaz</button> <button class="btn sm" data-act="${esc(t.code)}">${t.active?'Zablokovat':'Povolit'}</button> <button class="btn sm danger" data-del="${esc(t.code)}">Smazat</button></td></tr>`; }).join('')}</table>`:'<div class="empty">Zatím žádní testeři. Přidej prvního.</div>';
  $('#tT').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{ const u=new URL('./',location.href); u.searchParams.set('t',b.dataset.copy); try{ await navigator.clipboard.writeText(u.href); b.textContent='Zkopírováno'; }catch(e){ prompt('Odkaz pro testera:',u.href); } setTimeout(()=>b.textContent='Odkaz',1500); });
  $('#tT').querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{ const t=S.testers.find(x=>x.code===b.dataset.act); await api('vk_testers?code=eq.'+encodeURIComponent(t.code),{method:'PATCH',body:JSON.stringify({active:!t.active})}); load(); });
  $('#tT').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if (!confirm(`Trvale smazat testera ${b.dataset.del} a všechny jeho záznamy? Nelze vrátit.`)) return; await api('vk_testers?code=eq.'+encodeURIComponent(b.dataset.del),{method:'DELETE'}); if (S.code===b.dataset.del) S.code=''; load(); });
  $('#fC').innerHTML='<option value="">všichni testeři</option>'+S.testers.map(t=>`<option value="${esc(t.code)}" ${t.code===S.code?'selected':''}>${esc(t.code)}</option>`).join(''); renderSessions(); }
function renderSessions(){ const L=S.sessions.filter(s=>!S.code||s.code===S.code); $('#sT').innerHTML=L.length?`<table><tr><th>Tester</th><th>Začátek</th><th>Délka</th><th>Akcí</th><th>Chyb</th><th>Okno</th></tr>${L.map(s=>`<tr class="click ${s.id===S.sid?'on':''}" data-s="${esc(s.id)}"><td class="mono"><span class="dot ${live(s)?'live':''}"></span>${esc(s.code)}</td><td>${dt(s.started_at)}</td><td>${dur(span(s))}</td><td class="mono">${s.events_n}</td><td class="mono" style="${s.errors_n?'color:var(--crit)':''}">${s.errors_n}</td><td class="mono">${esc(s.meta?.w)}×${esc(s.meta?.h)}</td></tr>`).join('')}</table>`:'<div class="empty">Zatím žádné záznamy.</div>'; $('#sT').querySelectorAll('[data-s]').forEach(r=>r.onclick=()=>{ S.sid=r.dataset.s; renderSessions(); loadEvents(S.sid); }); }
async function addTester(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', n=S.testers.reduce((m,t)=>{ const x=/^T(\d+)-/.exec(t.code); return x?Math.max(m,+x[1]):m; },0)+1, r=crypto.getRandomValues(new Uint8Array(6)); const code=`T${String(n).padStart(2,'0')}-${[...r].map(v=>A[v%A.length]).join('')}`; await api('vk_testers',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({code,note:$('#nN').value.trim()})}); $('#nN').value=''; load(); }
async function loadEvents(id,quiet){ if (!quiet) $('#det').innerHTML='<div class="empty">Načítám…</div>'; let all=[], from=0; for (;;){ const p=await api(`vk_events?select=seq,at,kind,sim_h,data&session_id=eq.${encodeURIComponent(id)}&order=seq.asc&limit=1000&offset=${from}`); all=all.concat(p||[]); if (!p||p.length<1000||all.length>=20000) break; from+=1000; } if (S.sid!==id) return; const same=S.events&&S.evId===id&&S.events.length===all.length; S.events=all; S.evId=id; if (!same||!quiet) renderDetail(); }
const AREAS=[['Spuštění času',e=>e.kind==='run'],['Rychlost',e=>e.kind==='speed'],['Skok vpřed',e=>e.kind==='jump'],['Návrat v čase',e=>e.kind==='seek'],['Změna scénáře',e=>e.kind==='scenario'],['Výběr díla',e=>e.kind==='select'],['Detail díla',e=>e.kind==='detail'],['Detail soustrojí',e=>e.kind==='unit'],['Změna parametrů',e=>e.kind==='set'],['Rychlé akce',e=>e.kind==='action'],['Záložky',e=>e.kind==='tab'],['Průvodce',e=>e.kind==='tour'],['Nastavení',e=>e.kind==='settings']];
const NAMES={start:'Začátek',end:'Konec',run:'Čas',speed:'Rychlost',jump:'Skok',seek:'Návrat',scenario:'Scénář',select:'Výběr',detail:'Detail',unit:'Soustrojí',set:'Nastavení',action:'Akce',tab:'Záložka',click:'Klik',tour:'Průvodce',settings:'Nastavení',simevent:'Událost',error:'Chyba',focus:'Okno',state:'Stav'};
const FILT={act:['Akce testera',e=>!['state','simevent','focus'].includes(e.kind)],sim:['Události simulace',e=>e.kind==='simevent'],err:['Chyby',e=>e.kind==='error'],all:['Vše',()=>true]};
function evText(e){ const d=e.data||{}; switch(e.kind){ case 'run':return d.on?'spuštěno':'pozastaveno'; case 'speed':return d.v; case 'jump':return '+'+(d.sec>=86400?d.sec/86400+' d':d.sec/3600+' h'); case 'seek':return `z ${d.from} h na ${d.to} h`; case 'scenario':case 'select':case 'detail':return d.id; case 'unit':return `${d.id} TG${(+d.i||0)+1}`; case 'set':return `${d.id} = ${d.v}`; case 'action':case 'tab':case 'click':return d.id; case 'simevent':return d.msg; case 'error':return d.msg+(d.line?` (ř. ${d.line})`:''); case 'focus':return d.on?'vrátil se do okna':'odešel z okna'; case 'state':return `${d.sc} · Praha ${d.praha} m³/s · ${d.P} MW · Orlík ${d.orlik} m`+(d.idle?' · nečinný':''); case 'start':return d.sc||''; case 'end':return 'tester ukončil záznam'; default:return JSON.stringify(d); } }
function activeMs(E){ let a=0; for (let i=1;i<E.length;i++){ const g=new Date(E[i].at)-new Date(E[i-1].at), idle=E[i].kind==='state'&&E[i].data?.idle; if (!idle) a+=Math.min(g,90000); } return a; }
function renderDetail(){ const s=S.sessions.find(x=>x.id===S.sid), E=S.events; if (!s) return; const cover=AREAS.map(([n,f])=>[n,E.some(f)]), scs=[...new Set(E.filter(e=>e.kind==='scenario'||e.kind==='start').map(e=>e.data?.id||e.data?.sc).filter(Boolean))], m=s.meta||{};
  $('#det').innerHTML=`<div class="chead"><h2><span class="mono">${esc(s.code)}</span> · ${dt(s.started_at)}</h2><span class="sp" style="flex:1"></span><button class="btn sm" id="xJ">JSON</button><button class="btn sm" id="xC">CSV</button><button class="btn sm danger" id="xD">Smazat relaci</button></div>
  <div class="tiles" style="margin-bottom:10px">${[['Aktivní čas',dur(activeMs(E))],['Akcí',E.filter(FILT.act[1]).length],['Událostí sim.',E.filter(e=>e.kind==='simevent').length],['Chyb',E.filter(e=>e.kind==='error').length]].map(([l,v])=>`<div class="tile"><small>${l}</small><b>${esc(v)}</b></div>`).join('')}</div>
  <p class="note" style="margin:0 0 8px">${esc(m.br)} · ${esc(m.os)} · okno ${esc(m.w)}×${esc(m.h)} · zvětšení ${esc(m.dpr)} · scénáře: ${esc(scs.join(', ')||'—')}</p>
  <div class="chips" style="margin-bottom:10px" aria-label="Vyzkoušené funkce">${cover.map(([n,y])=>`<span class="chip ${y?'y':''}">${y?'✓':'–'} ${n}</span>`).join('')}</div>
  <canvas id="tr" role="img" aria-label="Průtok v Praze během relace"></canvas><p class="note" style="margin:2px 0 10px">Průtok v Praze (m³/s) podle pravidelných vzorků stavu simulace.</p>
  <div class="chead">${Object.entries(FILT).map(([k,[l]])=>`<button class="btn sm ${S.filter===k?'acc':''}" data-f="${k}">${l}</button>`).join('')}</div><div class="tl" id="tl"></div>`;
  $('#det').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ S.filter=b.dataset.f; renderDetail(); });
  $('#xJ').onclick=()=>save(`relace-${s.code}.json`,JSON.stringify({session:s,events:E},null,1),'application/json');
  $('#xC').onclick=()=>{ const q=v=>{ let x=String(v??''); if (/^[=+\-@\t\r]/.test(x)) x="'"+x; return '"'+x.replace(/"/g,'""')+'"'; }; save(`relace-${s.code}.csv`,'﻿poradi;cas;sim_hodina;typ;popis\n'+E.map(e=>[e.seq,e.at,e.sim_h,e.kind,evText(e)].map(q).join(';')).join('\n'),'text/csv'); };
  $('#xD').onclick=async()=>{ if (!confirm('Trvale smazat tuto relaci? Nelze vrátit.')) return; await api('vk_sessions?id=eq.'+encodeURIComponent(s.id),{method:'DELETE'}); S.sid=null; S.events=null; $('#det').innerHTML='<div class="empty">Relace smazána.</div>'; load(); };
  const V=E.filter(FILT[S.filter][1]).slice(-1500).reverse(); $('#tl').innerHTML=V.length?V.map(e=>`<div class="ev ${e.kind==='error'?'error':e.data?.sev==='crit'?'crit':e.data?.sev==='warn'?'warn':''}"><span class="mono muted">${tm(e.at)}</span><span class="mono muted">${e.sim_h!=null?(+e.sim_h).toFixed(1)+' h':''}</span><span class="k">${esc(NAMES[e.kind]||e.kind)}</span><span class="x">${esc(evText(e))}</span></div>`).join(''):'<div class="empty">Nic k zobrazení.</div>'; drawTrend(); }
function drawTrend(){ const c=$('#tr'); if (!c) return; const P=S.events.filter(e=>e.kind==='state'&&isFinite(e.data?.praha)), W=c.clientWidth, H=c.clientHeight, d=devicePixelRatio||1; c.width=W*d; c.height=H*d; const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0); const cs=getComputedStyle(document.documentElement), col=n=>cs.getPropertyValue(n).trim(); g.font='11px Consolas,monospace'; if (P.length<2){ g.fillStyle=col('--m'); g.textAlign='center'; g.fillText('Zatím málo vzorků (ukládají se každých 30 s)',W/2,H/2); return; }
  const a=+new Date(P[0].at), b=+new Date(P[P.length-1].at), mx=Math.max(...P.map(e=>e.data.praha),1)*1.08, L=46,R=W-6,T=6,B=H-16, X=t=>L+(R-L)*(t-a)/Math.max(1,b-a), Y=v=>B-(B-T)*v/mx; g.strokeStyle=col('--b'); g.fillStyle=col('--m'); g.textAlign='right'; for (const f of [0,.5,1]){ const v=mx*f, y=Math.round(Y(v))+.5; g.beginPath(); g.moveTo(L,y); g.lineTo(R,y); g.stroke(); g.fillText(Math.round(v),L-5,y+4); } g.textAlign='left'; g.fillText(tm(a),L,H-3); g.textAlign='right'; g.fillText(tm(b),R,H-3); g.strokeStyle=col('--a'); g.lineWidth=2; g.beginPath(); P.forEach((e,i)=>{ const x=X(+new Date(e.at)), y=Y(e.data.praha); i?g.lineTo(x,y):g.moveTo(x,y); }); g.stroke(); }
function save(name,text,type){ const u=URL.createObjectURL(new Blob([text],{type})), a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
window.addEventListener('unhandledrejection',e=>{ $('#st').textContent='Chyba: '+(e.reason?.message||e.reason); });
